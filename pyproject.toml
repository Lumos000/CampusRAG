[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "campus-rag"
version = "0.1.0"
description = "Offline campus RAG for Nanjing University of Posts and Telecommunications"
requires-python = ">=3.10"
dependencies = [
  "beautifulsoup4>=4.12,<5",
  "lxml>=5,<7",
  "numpy>=1.26,<3",
  "openpyxl>=3.1,<4",
  "PyMuPDF>=1.24,<2",
  "python-docx>=1.1,<2",
  "requests>=2.32,<3",
  "sentence-transformers>=3,<6",
  "torch>=2.3,<3",
  "transformers>=4.51,<6",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

